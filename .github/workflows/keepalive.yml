# Supabase pausa los proyectos gratuitos tras una semana sin actividad (por ejemplo, en vacaciones).
# Esta tarea "visita" la base de datos una vez al día para mantenerla activa.
name: Mantener Supabase activo

on:
  schedule:
    - cron: '17 12 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Visitar la base de datos
        env:
          SUPABASE_URL: https://pdyrlbfuoqafrxehbljx.supabase.co
          # Clave pública (la misma que usa la app en el navegador).
          SUPABASE_KEY: sb_publishable_hxfH6eSbiJmYjb44mUQwTQ_gKqF6id7
        run: |
          curl -fsS -X POST "$SUPABASE_URL/rest/v1/rpc/ping" \
            -H "apikey: $SUPABASE_KEY" -H "Content-Type: application/json" -d '{}'
